name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Generate site index
        run: |
          python update-blog-index.py

      - name: Generate Pagefind Search Index
        # 排除 archive 副本（~1435 个）和 drafts 草稿（~54 个），避免污染搜索索引：
        #   - 旧实现索引全站 → 同一篇文章出现 3-4 个 archive 日期副本，搜索结果重复
        #   - drafts 是未发布草稿，不该被搜到
        # 构建期间临时移走，构建后移回 —— archive 文件本身仍可被直接 URL 访问
        run: |
          [ -d archive ] && mv archive /tmp/archive-stash || true
          [ -d drafts ] && mv drafts /tmp/drafts-stash || true
          npx pagefind --site . --output-subdir _pagefind
          [ -d /tmp/archive-stash ] && mv /tmp/archive-stash archive
          [ -d /tmp/drafts-stash ] && mv /tmp/drafts-stash drafts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4